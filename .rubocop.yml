require:
  - standard

plugins:
  - rubocop-rspec
  - rubocop-rake

inherit_gem:
  standard: config/base.yml

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

RSpec/MultipleMemoizedHelpers:
  AllowSubject: true
  Max: 10

RSpec/NestedGroups:
  Max: 5

RSpec/ExampleLength:
  Max: 30

RSpec/MultipleExpectations:
  Max: 10
